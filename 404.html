<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | Nahuel Villar</title>
  <link rel="icon" href="/images/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f8f7f4;background:oklch(98.5% 0.003 90);color:#171717;font-family:'Instrument Sans',sans-serif}
    header{display:flex;align-items:center;justify-content:space-between;padding:16px clamp(20px,6vw,80px);border-bottom:1px solid #ddd;gap:16px}header img{width:44px;height:auto;display:block}
    nav{display:flex;gap:4px}button{font:inherit;font-size:.8rem;min-width:44px;min-height:44px;border:0;background:transparent;color:#555;cursor:pointer}button[aria-pressed="true"]{color:#b33c19;text-decoration:underline;text-underline-offset:5px}
    main{max-width:960px;margin:0 auto;padding:clamp(64px,12vh,150px) clamp(20px,6vw,80px)}.label{font-size:.8rem;letter-spacing:.14em;color:#b33c19}h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(2.25rem,6vw,4.5rem);font-weight:600;letter-spacing:-.04em;line-height:1.08;max-width:13ch;margin:22px 0}p{color:#555;font-size:1.08rem;line-height:1.65;max-width:44ch}main a{display:inline-flex;align-items:center;margin-top:24px;min-height:44px;color:inherit;text-decoration-thickness:1px;text-underline-offset:6px}a:focus-visible,button:focus-visible{outline:2px solid #b33c19;outline-offset:4px}
  </style>
</head>
<body>
<header><a href="/" aria-label="Nahuel Villar"><img src="/images/logo.png" alt=""></a><nav aria-label="Language"><button type="button" lang="en" data-lang="en" aria-label="English" aria-pressed="true">EN</button><button type="button" lang="es" data-lang="es" aria-label="Español" aria-pressed="false">ES</button><button type="button" lang="de" data-lang="de" aria-label="Deutsch" aria-pressed="false">DE</button></nav></header>
<main><div class="label">404</div><h1>Page not found.</h1><p>This address does not lead to a page in the portfolio. You can return to Work to explore the projects.</p><a id="return-link" href="/">Back to Work →</a></main>
<script>
const copy={en:{title:'Page not found.',body:'This address does not lead to a page in the portfolio. You can return to Work to explore the projects.',link:'Back to Work →',nav:'Language'},es:{title:'Página no encontrada.',body:'Esta dirección no corresponde a una página del portfolio. Podés volver a Proyectos para recorrer los trabajos.',link:'Volver a Proyectos →',nav:'Idioma'},de:{title:'Seite nicht gefunden.',body:'Unter dieser Adresse gibt es keine Seite im Portfolio. Über Projekte kannst du die Arbeiten entdecken.',link:'Zurück zu den Projekten →',nav:'Sprache'}};
document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>{const lang=button.dataset.lang,t=copy[lang];document.documentElement.lang=lang;document.title=t.title+' | Nahuel Villar';document.querySelector('h1').textContent=t.title;document.querySelector('main p').textContent=t.body;document.getElementById('return-link').textContent=t.link;document.querySelector('nav').setAttribute('aria-label',t.nav);document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));}));
</script>
</body>
</html>
