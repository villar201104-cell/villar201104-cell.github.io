<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Intervalo · Service in motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
<link rel="stylesheet" href="shared-3d/viewer-controls.css"><style>:root{--viewer-accent:#0063C2}</style></head>
<body>
<main>
 <header class="intro"><div><p class="eyebrow" data-i18n="eyebrow">INTERVALO / SERVICE IN MOTION</p><h1 data-i18n="title">One stop. A little more time.</h1><p class="lede" data-i18n="lede"></p></div><div class="page-tools"><select id="language" data-i18n-label="language"><option value="en">EN</option><option value="es">ES</option><option value="de">DE</option></select><a class="back" href="https://nahuelvillar.com/project/intervalo/" data-i18n="back"></a></div></header>
 <section class="experience" data-i18n-label="scene">
  <div class="scene-wrap" id="scene-wrap">
   <canvas id="scene" data-i18n-label="canvas" tabindex="0"></canvas>
   <div id="loading" role="status"><span class="loader"></span><strong data-i18n="loading"></strong><span id="load-detail" data-i18n="loadingDetail"></span></div>
   <div class="story-caption" id="story" hidden><div class="narration-context"><span class="narration-label" data-i18n="narration"></span><span id="subtitle-island"></span></div><p id="subtitle" role="status" aria-live="polite" aria-atomic="true"></p></div>
   <div class="scene-heading"><span class="eyebrow">INTERVALO</span><span class="hint" data-i18n="hint"></span></div>
  </div>
  <div class="timeline-panel">
   <div class="timeline-meta"><span data-i18n="loop"></span><span id="activity"></span></div>
   <div class="timeline-row"><button id="play" class="icon-button" data-i18n-label="pause">Ⅱ</button><button id="restart" class="icon-button" data-i18n-label="restart">↺</button><label class="sr-only" for="timeline" data-i18n="timeline"></label><input id="timeline" type="range" min="0" max="540" step=".1" value="0"><output id="timecode">0:00 / 9:00</output></div>
  </div>
  <div class="toolbar">
   <div class="view-tools" role="group" data-i18n-label="views"><button data-view="follow" class="selected" aria-pressed="true" data-i18n="follow"></button><button data-view="general" aria-pressed="false" data-i18n="general"></button><button data-view="service" aria-pressed="false" data-i18n="service"></button></div>
   <div class="appearance" role="group" data-i18n-label="appearance"><button data-mode="materials" aria-pressed="false" data-i18n="materials"></button><button data-mode="focus" class="selected" aria-pressed="true" data-i18n="focus"></button></div>
   <div class="extra-tools"><button id="dialogues" type="button" data-i18n="dialogues" aria-pressed="true" hidden></button><button id="captions" aria-pressed="true" data-i18n="captions"></button><button id="roof" aria-pressed="false" data-i18n="roof"></button><select id="speed" data-i18n-label="speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select><button id="fullscreen" data-i18n="fullscreen"></button></div>
  </div>
  <p id="camera-description" class="camera-description"></p>
  <div class="service-selector" role="group" data-i18n-label="services"><span class="control-label" data-i18n="services"></span><button data-service="coffee" data-i18n="coffee" aria-pressed="false"></button><button data-service="snack" data-i18n="snack" aria-pressed="false"></button><button data-service="drink" data-i18n="drink" aria-pressed="false"></button><button data-service="fuel" data-i18n="fuel" aria-pressed="false"></button><button data-service="clean" data-i18n="clean" aria-pressed="false"></button></div>
 </section>
 <footer><p data-i18n="footer"></p><span data-i18n="note"></span></footer>
</main>
<script type="module" src="simulation.js"></script>
<script src="shared-3d/viewer-controls.js"></script></body></html>
